name: iOS Build (Client + Captain)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. Get the source code from your repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup the signing environment (The part you shared)
      - name: Install Signing Certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          CLIENT_PROVISION_PROFILE_BASE64: ${{ secrets.CLIENT_PROVISION_PROFILE_BASE64 }}
          CAPTAIN_PROVISION_PROFILE_BASE64: ${{ secrets.CAPTAIN_PROVISION_PROFILE_BASE64 }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app.keychain-db

          # Decode the files from your GitHub Secrets
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERT_PATH
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$CLIENT_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/client.mobileprovision
          echo "$CAPTAIN_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/captain.mobileprovision

          # Create and unlock a temporary keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH

          # Import the certificate
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          
          # Fix for permission popups
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH

      # 3. Build the Client App
      - name: Build Client App
        run: |
          cd ClientApp
          xcodebuild -scheme ClientApp -sdk iphoneos build

      # 4. Build the Captain App
      - name: Build Captain App
        run: |
          cd CaptainApp
          xcodebuild -scheme CaptainApp -sdk iphoneos build