name: iOS Build (Client + Captain)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install certificate + provisioning profiles
      - name: Install Signing Certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          CLIENT_PROVISION_PROFILE_BASE64: ${{ secrets.CLIENT_PROVISION_PROFILE_BASE64 }}
          CAPTAIN_PROVISION_PROFILE_BASE64: ${{ secrets.CAPTAIN_PROVISION_PROFILE_BASE64 }}

        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app.keychain-db

          CLIENT_PP_PATH=$RUNNER_TEMP/client.mobileprovision
          CAPTAIN_PP_PATH=$RUNNER_TEMP/captain.mobileprovision

          # Decode certificate
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH

          # Decode provisioning profiles
          echo -n "$CLIENT_PROVISION_PROFILE_BASE64" | base64 --decode -o $CLIENT_PP_PATH
          echo -n "$CAPTAIN_PROVISION_PROFILE_BASE64" | base64 --decode -o $CAPTAIN_PP_PATH

          # Create temporary keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH

          # Import certificate
          security import $CERT_PATH \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k $KEYCHAIN_PATH

          security list-keychain -d user -s $KEYCHAIN_PATH

          # Install provisioning profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $CLIENT_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/client.mobileprovision
          cp $CAPTAIN_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/captain.mobileprovision

      # 3. Build Client App
      - name: Build Client App
        run: |
          cd ClientApp
          xcodebuild \
            -scheme ClientApp \
            -sdk iphoneos \
            build

      # 4. Build Captain App
      - name: Build Captain App
        run: |
          cd CaptainApp
          xcodebuild \
            -scheme CaptainApp \
            -sdk iphoneos \
            build
